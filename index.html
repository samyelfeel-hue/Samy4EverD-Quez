function submitQuiz(){let score=0;current[2].forEach((q,i)=>{if(answers[i]===q[2])score++});let pct=(score/current[2].length*100).toFixed(1);let review='<div class="result"><h2>Score: '+score+' / '+current[2].length+' ('+pct+'%)</h2><p>Answered: '+answers.filter(x=>x!==null).length+' of '+current[2].length+'</p><hr>';current[2].forEach((q,i)=>{let ok=answers[i]===q[2];review+='<p class="'+(ok?'good':'bad')+'"><b>'+(i+1)+'. '+(ok?'✓ Correct':'✗ Incorrect')+'</b>'+(ok?'':' — Correct answer: '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]])+'</p>'});review+='<button class="primary" onclick="start(subjects.indexOf(current))">Retry</button></div>';document.getElementById('result').innerHTML=review;document.getElementById('result').scrollIntoView({behavior:'smooth'})}
function home(){document.getElementById('quiz').style.display='none';document.getElementById('home').style.display='block'}
</script></body></html>
