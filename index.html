<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pharmacy Quiz Hub</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#14213d}.top{background:linear-gradient(135deg,#123b72,#1f6fb2);color:white;padding:38px 20px}.wrap{max-width:1050px;margin:auto}.top h1{margin:0 0 8px;font-size:34px}.top p{margin:0;opacity:.9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding:24px 0}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 5px 20px #16324f18;border:1px solid #e6edf5;cursor:pointer}.card:hover{transform:translateY(-2px)}.icon{font-size:30px}.card h3{margin:10px 0 6px}.pill{font-size:12px;background:#e9f4ff;color:#145a96;padding:5px 9px;border-radius:99px;display:inline-block}.muted{color:#6b778c;font-size:13px}.quiz{display:none;padding:24px 0}.bar{height:10px;background:#dfe7ef;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#2674b8}.qbox{background:white;padding:26px;border-radius:16px;margin-top:18px;box-shadow:0 5px 20px #16324f18}.opt{display:block;border:1px solid #d8e1eb;padding:13px;margin:10px 0;border-radius:10px;cursor:pointer}.opt:hover{background:#f1f7fd}.nav{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}.primary{background:#1769aa;color:#fff}.secondary{background:#e8eef5}.result{background:white;padding:26px;border-radius:16px;margin-top:18px}.good{color:#19763b}.bad{color:#b3261e}@media(max-width:600px){.top h1{font-size:28px}.wrap{padding:0 14px}}</style></head><body>

<script>
const subjects=[["Microbiology","🦠",null],["Dosage Forms & Pharmaceutics","💊",[["According to Stoke's Law, sedimentation rate increases when:",["Particle size decreases","Medium viscosity increases","Density difference increases","Gravity decreases"],2],["The main purpose of enteric coating is to:",["Enhance tablet hardness","Protect the drug from gastric acid","Increase dissolution rate in stomach","Improve tablet lubrication"],1],["Which factor MOST affects drug dissolution rate according to the Noyes–Whitney equation?",["Drug color","Surface area","Tablet shape","Manufacturing cost"],1],["A suspension is considered physically unstable when:",["Sedimentation occurs","Caking occurs","Flocculation occurs","Brownian motion occurs"],1],["Which is an example of a hydrophilic ointment base?",["White petrolatum","Lanolin","Polyethylene glycol (PEG)","Mineral oil"],2],["The HLB system is used to:",["Measure tablet hardness","Select emulsifying agents","Determine drug solubility","Measure viscosity"],1],["Which sterilization method is most appropriate for heat-sensitive solutions?",["Autoclaving","Dry heat","Filtration","Radiation"],2],["The purpose of a plasticizer in film coating is to:",["Increase brittleness","Improve flexibility","Increase disintegration time","Reduce solubility"],1],["An oil-in-water (O/W) emulsion can be identified by:",["It conducts electricity","It does not mix with water","It has oil as external phase","It repels aqueous dyes"],0],["Which dosage form bypasses first-pass metabolism?",["Oral tablet","Sublingual tablet","Oral suspension","Enteric-coated capsule"],1],["Increasing viscosity in a suspension generally:",["Increases sedimentation rate","Decreases sedimentation rate","Has no effect","Causes caking"],1],["Which polymer is commonly used in controlled-release formulations?",["Lactose","Hydroxypropyl methylcellulose (HPMC)","Talc","Starch"],1],["A preservative is added to multidose ophthalmic solutions to:",["Improve clarity","Increase tonicity","Prevent microbial growth","Enhance absorption"],2],["The isotonicity of ophthalmic solutions is usually adjusted using:",["Sodium chloride","Ethanol","Magnesium stearate","Propylene glycol"],0],["Which increases tablet hardness?",["Decreasing compression force","Increasing compression force","Adding more lubricant","Reducing binder concentration"],1],["A drug with poor aqueous solubility can have improved bioavailability by:",["Increasing particle size","Forming a salt","Increasing crystallinity","Reducing surface area"],1],["Which is TRUE about lyophilization?",["It uses high heat","It removes water by sublimation","It is used only for tablets","It increases hydrolysis rate"],1],["The main advantage of transdermal patches is:",["Rapid onset","Avoidance of hepatic first-pass effect","Increased gastric irritation","Immediate drug release"],1],["Which is a water-in-oil (W/O) emulsifying agent?",["Sodium lauryl sulfate","Polysorbate 80","Sorbitan monooleate","PEG 400"],2],["Which material exhibits Newtonian flow?",["Toothpaste","Ketchup","Water","Flocculated suspension"],2],["A pseudoplastic system shows:",["Increased viscosity with increased shear","Decreased viscosity with increased shear","Constant viscosity","Plastic flow with yield value"],1],["A material requiring a minimum force before it begins to flow exhibits:",["Newtonian flow","Pseudoplastic flow","Plastic flow","Dilatant flow"],2],["Thixotropy refers to:",["Time-dependent decrease in viscosity","Time-dependent increase in viscosity","Constant viscosity","Yield stress"],0],["According to Stoke's Law, sedimentation rate is directly proportional to:",["Viscosity","Particle radius squared","Temperature","pH"],1],["Which factor decreases bioavailability?",["Sublingual route","First-pass metabolism","Increased solubility","Increased permeability"],1],["Increasing shear rate in a pseudoplastic liquid will:",["Increase viscosity","Decrease viscosity","Not change viscosity","Cause caking"],1],["Absolute bioavailability compares:",["Oral vs. IM administration","Oral vs. IV administration","IV vs. SC administration","Sublingual vs. transdermal"],1],["Which parameter is MOST directly related to extent of drug absorption?",["Cmax","Tmax","AUC","Half-life"],2],["A narrow therapeutic index drug requires:",["No monitoring","Large dose adjustments","Therapeutic drug monitoring","Immediate-release formulation"],2],["A competitive antagonist shifts the dose-response curve:",["Upward","Downward","To the right","To the left"],2],["A noncompetitive antagonist reduces:",["Potency only","Efficacy only","Both potency and efficacy","Neither potency nor efficacy"],1],["Potency is best described as:",["Maximum effect achieved","Dose required to produce a given effect","Drug toxicity","Therapeutic index"],1],["Emax represents:",["Drug potency","Maximum efficacy","Half-life","Clearance"],1],["A partial agonist:",["Produces full effect","Produces no effect","Produces less than maximal effect","Blocks receptor permanently"],2],["First-pass metabolism primarily occurs in the:",["Kidney","Liver","Lung","Heart"],1],["Enterohepatic recirculation may result in:",["Decreased half-life","Multiple plasma peaks","Reduced bioavailability","Faster clearance"],1],["Which factor increases drug absorption?",["Increased particle size","Decreased surface area","Increased lipid solubility","Ionized form of drug"],2],["Weak acids are better absorbed in:",["Basic pH","Acidic pH","Neutral pH","Plasma"],1],["Zero-order kinetics means:",["Constant fraction eliminated","Constant amount eliminated per time","Half-life constant","Clearance proportional to concentration"],1],["First-order elimination is characterized by:",["Constant amount eliminated","Concentration-independent elimination","Constant fraction eliminated","Saturation at low doses"],2],["Volume of distribution (Vd) indicates:",["Drug metabolism rate","Drug elimination rate","Drug distribution into tissues","Renal clearance"],2],["A drug highly bound to plasma proteins will generally have:",["High Vd","Low Vd","Rapid elimination","High clearance"],1],["Controlled-release formulations are designed to:",["Increase dosing frequency","Maintain steady plasma levels","Increase Cmax","Reduce half-life"],1],["Bioequivalence requires 90% confidence intervals of AUC and Cmax within:",["70–130%","75–125%","80–125%","85–115%"],2],["A dilatant system exhibits:",["Decreased viscosity with shear","Increased viscosity with shear","Yield value","Newtonian behavior"],1],["The therapeutic index (TI) is calculated as:",["ED50 / LD50","LD50 / ED50","Cmax / Tmax","AUC / Cmax"],1],["A drug with high extraction ratio in the liver:",["Is minimally metabolized","Has flow-dependent clearance","Has enzyme-dependent clearance","Has no first-pass effect"],1]]],["Anti-Cancer Drugs","🎗️",[["Cyclophosphamide primarily works by:",["Inhibiting topoisomerase I","Alkylating DNA","Blocking microtubule formation","Inhibiting thymidylate synthase"],1],["Hemorrhagic cystitis caused by cyclophosphamide is due to:",["Acrolein","Methotrexate","Doxorubicin","Cisplatin"],0],["Which drug prevents cyclophosphamide-induced hemorrhagic cystitis?",["Leucovorin","Mesna","Dexrazoxane","Filgrastim"],1],["Doxorubicin causes dose-dependent:",["Pulmonary fibrosis","Cardiotoxicity","Nephrotoxicity","Neurotoxicity"],1],["Dexrazoxane is used to prevent toxicity from:",["Cisplatin","Bleomycin","Doxorubicin","Vincristine"],2],["Bleomycin toxicity primarily affects the:",["Liver","Kidney","Lung","Heart"],2],["Methotrexate inhibits:",["Topoisomerase II","Dihydrofolate reductase","Microtubules","RNA polymerase"],1],["Methotrexate toxicity can be reduced with:",["Mesna","Leucovorin","Filgrastim","Erythropoietin"],1],["Severe diarrhea from irinotecan may be treated with:",["Leucovorin","Loperamide","Mesna","Filgrastim"],1],["Which drug is associated with hand-foot syndrome?",["Vincristine","5-FU","Bleomycin","Rituximab"],1],["Cisplatin commonly causes:",["Cardiotoxicity","Ototoxicity","Pulmonary fibrosis","Hemorrhagic cystitis"],1],["Nephrotoxicity from cisplatin may be reduced by:",["Hydration","Leucovorin","Dexrazoxane","Mesna"],0],["Vincristine works by:",["Inhibits DNA polymerase","Preventing microtubule polymerization in Mitosis","Alkylating DNA","Inhibiting topoisomerase I"],1],["Vincristine major dose-limiting toxicity is:",["Myelosuppression","Peripheral neuropathy","Nephrotoxicity","Pulmonary fibrosis"],1],["Paclitaxel mechanism:",["Inhibits topoisomerase","Stabilizes microtubules in Mitosis","Alkylates DNA","Inhibits DHFR"],1],["Trastuzumab targets:",["EGFR","HER2 receptor","VEGF","CD20"],1],["Rituximab targets:",["CD20","HER2","VEGF","BCR-ABL"],0],["Imatinib inhibits:",["Topoisomerase II","BCR-ABL tyrosine kinase","VEGF receptor","EGFR"],1],["Tumor lysis syndrome can cause:",["Hypokalemia","Hypouricemia","Hyperuricemia","Hypophosphatemia"],2],["Allopurinol prevents tumor lysis syndrome by:",["Breaking down uric acid","Inhibiting xanthine oxidase","Increasing renal clearance","Chelating calcium"],1],["Rasburicase works by:",["Inhibiting uric acid production","Converting uric acid to allantoin","Chelating potassium","Blocking phosphate"],1],["Filgrastim is used to treat:",["Anemia","Neutropenia","Thrombocytopenia","Hyperkalemia"],1],["Erythropoietin is used for chemotherapy-induced:",["Neutropenia","Anemia","Thrombocytopenia","Neuropathy"],1],["Thrombocytopenia can be treated with:",["Oprelvekin","Mesna","Leucovorin","Dexrazoxane"],0],["Tamoxifen is a:",["Aromatase inhibitor","Selective estrogen receptor modulator","Alkylating agent","Monoclonal antibody"],1],["Aromatase inhibitors include:",["Tamoxifen","Anastrozole","Trastuzumab","Rituximab"],1],["Bevacizumab works by inhibiting:",["EGFR","HER2","VEGF","CD20"],2]]],["Basic Pharmacology","⚕️",null],["Asthma","🫁",null],["Autonomic Nervous System","🧠",null],["Biochemistry","🧬",null],["Diabetes","🩸",null],["Endocrinology","🧪",null],["Biostatistics","📊",null],["GIT","🩺",null],["Eicosanoids & NSAIDs","💠",null],["Neurodegenerative Diseases","🧠",null],["Anti-Infectives","🧫",null],["Immunology","🛡️",null],["Kinetics Calculations","🧮",null]]; let current=null,idx=0,answers=[];
const grid=document.getElementById('grid');
subjects.forEach((s,i)=>{const active=!!s[2];const d=document.createElement('div');d.className='card';d.innerHTML='<div class="icon">'+s[1]+'</div><h3>'+s[0]+'</h3><span class="pill">'+(active?s[2].length+' questions ready':'PDF source loaded')+'</span><p class="muted">'+(active?'Start interactive quiz →':'This subject is queued for interactive conversion.')+'</p>'; if(active)d.onclick=()=>start(i);grid.appendChild(d)});
function start(i){current=subjects[i];idx=0;answers=Array(current[2].length).fill(null);document.getElementById('home').style.display='none';document.getElementById('quiz').style.display='block';document.getElementById('title').textContent=current[0];render()}
function render(){const qs=current[2],q=qs[idx];document.getElementById('meta').textContent='Question '+(idx+1)+' of '+qs.length;document.getElementById('prog').style.width=((idx+1)/qs.length*100)+'%';let x='<h3>'+(idx+1)+'. '+q[0]+'</h3>';q[1].forEach((o,j)=>x+='<label class="opt"><input type="radio" name="a" '+(answers[idx]===j?'checked':'')+' onchange="answers['+idx+']='+j+'"> '+String.fromCharCode(65+j)+'. '+o+'</label>');document.getElementById('qbox').innerHTML=x;document.getElementById('result').innerHTML=''}
function next(){if(idx<current[2].length-1){idx++;render()}} function prev(){if(idx>0){idx--;render()}}
function submitQuiz(){let score=0;current[2].forEach((q,i)=>{if(answers[i]===q[2])score++});let pct=(score/current[2].length*100).toFixed(1);let review='<div class="result"><h2>Score: '+score+' / '+current[2].length+' ('+pct+'%)</h2><p>Answered: '+answers.filter(x=>x!==null).length+' of '+current[2].length+'</p><hr>';current[2].forEach((q,i)=>{let ok=answers[i]===q[2];review+='<p class="'+(ok?'good':'bad')+'"><b>'+(i+1)+'. '+(ok?'✓ Correct':'✗ Incorrect')+'</b>'+(ok?'':' — Correct answer: '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]])+'</p>'});review+='<button class="primary" onclick="start(subjects.indexOf(current))">Retry</button></div>';document.getElementById('result').innerHTML=review;document.getElementById('result').scrollIntoView({behavior:'smooth'})}
function home(){document.getElementById('quiz').style.display='none';document.getElementById('home').style.display='block'}
</script></body></html>
